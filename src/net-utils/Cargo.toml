[package]
name = "net-utils"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Independently authored Rust reconstruction of Hyperliquid node #115 net_utils transport, LZ4 framing, gossip wire, and HTTP/2 framing"

[dependencies]
bincode-fork = { path = "../bincode-fork" }
node115-frame-stream = { path = "../node115-frame-stream" }
node115-greeting-encoder = { path = "../node115-greeting-encoder" }
node115-h2-framing = { path = "../node115-h2-framing" }
node115-host-ip-gates = { path = "../node115-host-ip-gates" }
node115-http-header-writer = { path = "../node115-http-header-writer" }
node115-listener-prefix = { path = "../node115-listener-prefix" }
node115-lz4-decode = { path = "../node115-lz4-decode" }
node115-lz4-dictionary-kernel = { path = "../node115-lz4-dictionary-kernel" }
node115-lz4-literal-encoder = { path = "../node115-lz4-literal-encoder" }
node115-lz4-match-extension = { path = "../node115-lz4-match-extension" }
node115-lz4-match-sequence = { path = "../node115-lz4-match-sequence" }
node115-newline-requests = { path = "../node115-newline-requests" }
node115-owned-frame-send = { path = "../node115-owned-frame-send" }
node115-owned-tcp-receive = { path = "../node115-owned-tcp-receive" }
node115-peer-address-admission = { path = "../node115-peer-address-admission" }
node115-tcp-compression-plan = { path = "../node115-tcp-compression-plan" }
node115-tcp-frame-plan = { path = "../node115-tcp-frame-plan" }
node115-tcp-stream-frame-lz4 = { path = "../node115-tcp-stream-frame-lz4" }
node115-write-progress = { path = "../node115-write-progress" }

[profile.release]
opt-level = 3
panic = "abort"
codegen-units = 1
