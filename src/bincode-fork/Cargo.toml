[package]
name = "bincode-fork"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Independently authored Rust reconstruction of Hyperliquid node #115 z_forks/bincode-fork wire codec"

[dependencies]
node115-attachment-reader = { path = "../node115-attachment-reader" }
node115-bulk-record-decoder = { path = "../node115-bulk-record-decoder" }
node115-field1-5-varint-reader = { path = "../node115-field1-5-varint-reader" }
node115-gossip-address-vector = { path = "../node115-gossip-address-vector" }
node115-signed-scalar = { path = "../node115-signed-scalar" }
node115-tcp-bincode-error = { path = "../node115-tcp-bincode-error" }
node115-u32-varint = { path = "../node115-u32-varint" }
node115-u64-reader-state = { path = "../node115-u64-reader-state" }
node115-varint-buffer-writer = { path = "../node115-varint-buffer-writer" }

[profile.release]
opt-level = 3
panic = "abort"
codegen-units = 1
