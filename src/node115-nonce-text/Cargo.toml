[package]
name = "node115-nonce-text"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
node115-nonce-ring = { path = "../node115-nonce-ring" }

[lib]
crate-type = ["rlib"]

[[bin]]
name = "nonce-text-client"
path = "src/bin/client.rs"

[profile.release]
opt-level = 2
panic = "abort"
codegen-units = 1
lto = false
