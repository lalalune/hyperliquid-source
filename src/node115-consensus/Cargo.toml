[package]
name = "node115-consensus"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false
description = "Cohesive node #115 consensus library integrating certificate verification, quorum arithmetic, signed admission, timeout flow, and round progression"

[lib]
path = "src/lib.rs"

[dependencies]
node115-certificate-caller = { path = "../node115-certificate-caller" }
node115-certificate-long-sort = { path = "../node115-certificate-long-sort" }
node115-consensus-batch-floor = { path = "../node115-consensus-batch-floor" }
node115-consensus-timer-conversion = { path = "../node115-consensus-timer-conversion" }
node115-execution-history-selection = { path = "../node115-execution-history-selection" }
node115-execution-order = { path = "../node115-execution-order" }
node115-nested-certificate-decision = { path = "../node115-nested-certificate-decision" }
node115-stake-predicate = { path = "../node115-stake-predicate" }
node115-varint-buffer-writer = { path = "../node115-varint-buffer-writer" }
node115-vote-eligibility = { path = "../node115-vote-eligibility" }

[workspace]
