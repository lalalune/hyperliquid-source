[package]
name = "zforks_w2_alloy_evm"
version = "0.0.0"
edition = "2021"

[dependencies]
tikv-jemallocator = "=0.6.0"
alloy-evm = { version = "=0.37.1", features = ["std", "rpc", "engine", "call-util", "overrides"] }
alloy-eip7928 = "=0.4.1"
alloy-consensus = { version = "=2.1.1", features = ["serde", "k256"] }
alloy-eips = { version = "=2.1.1", features = ["serde"] }
alloy-rpc-types-eth = "=2.1.1"
alloy-rpc-types-engine = "=2.1.1"
alloy-trie = "=0.9.5"
alloy-hardforks = "=0.4.12"
alloy-chains = "=0.2.40"
alloy-json-abi = "=1.6.1"
alloy-primitives = { version = "=1.6.1", features = ["serde", "rlp", "k256"] }
alloy-rlp = "=0.3.17"
jsonrpsee-core = { version = "=0.24.7", features = ["client", "server"] }
jsonrpsee-types = "=0.24.7"
rmp-serde = "=1.3.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.140"
ethers-core = "=2.0.14"
rust_decimal = "=1.36.0"
curve25519-dalek-ng = "=4.1.1"
k256 = "=0.13.4"

[profile.release]
opt-level = 3
overflow-checks = true
lto = "thin"
