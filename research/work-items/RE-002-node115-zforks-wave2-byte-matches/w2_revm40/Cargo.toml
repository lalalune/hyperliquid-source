[package]
name = "zforks_w2_revm40"
version = "0.0.0"
edition = "2021"

[dependencies]
tikv-jemallocator = "=0.6.0"
revm = { version = "=40.0.3", default-features = false, features = ["std", "blst", "secp256k1", "portable", "serde", "dev"] }
alloy-primitives = { version = "=1.5.2", features = ["serde", "rlp", "k256"] }
alloy-eip7928 = "=0.4.1"
alloy-consensus = { version = "=1.7.3", features = ["serde", "k256"] }
alloy-consensus-any = "=1.7.3"
alloy-eips = { version = "=1.8.3", features = ["serde"] }
alloy-rpc-types-eth = "=1.7.3"
alloy-json-abi = "=1.5.2"
alloy-sol-types = "=1.5.2"
alloy-trie = "=0.9.4"
alloy-rlp = "=0.3.17"
ark-bls12-381 = "=0.5.0"
ark-bn254 = "=0.5.0"
ark-ec = "=0.5.0"
ark-ff = "=0.5.0"
serde_json = "=1.0.140"

[profile.release]
opt-level = 3
overflow-checks = true
lto = "thin"
