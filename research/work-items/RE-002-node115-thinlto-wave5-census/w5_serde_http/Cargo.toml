[package]
name = "thinlto_w5_serde_http"
version = "0.0.0"
edition = "2021"

[dependencies]
tikv-jemallocator = "=0.6.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value", "unbounded_depth", "preserve_order"] }
rmp-serde = "=1.3.0"
rmp = "=0.8.15"
bincode = { version = "=2.0.1", features = ["serde"] }
bincode1 = { package = "bincode", version = "=1.3.3" }
bytes = "=1.12.1"
http = "=0.2.12"
http1 = { package = "http", version = "=1.5.0" }
h2 = "=0.3.27"
hyper = { version = "=0.14.32", features = ["full"] }
axum = { version = "=0.6.20", features = ["ws", "headers", "macros", "multipart", "matched-path", "original-uri", "query", "tokio", "http1", "http2", "json"] }
tower = { version = "=0.4.13", features = ["full"] }
futures-util = { version = "=0.3.31", features = ["io", "sink", "channel"] }
futures-channel = "=0.3.31"
primitive-types = { version = "=0.12.2", features = ["serde", "rlp"] }
alloy-primitives = { version = "=1.6.1", features = ["serde", "rlp", "k256"] }
ruint = { version = "=1.18.0", features = ["serde", "rlp"] }
rust_decimal = { version = "=1.36.0", features = ["serde", "maths"] }
indexmap = { version = "=2.5.0", features = ["serde"] }
smallvec = { version = "=1.13.2", features = ["serde"] }
serde_path_to_error = "=0.1.17"

[profile.release]
opt-level = 3
overflow-checks = true
lto = "thin"
