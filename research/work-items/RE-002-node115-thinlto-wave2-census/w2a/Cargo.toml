[package]
name = "thinlto_w2a"
version = "0.0.0"
edition = "2021"

[dependencies]
tikv-jemallocator = "=0.6.0"
tokio = { version = "=1.44.2", features = ["full"] }
tokio-util = { version = "=0.7.11", features = ["full"] }
h2 = "=0.3.26"
http = "=0.2.12"
hyper = { version = "=0.14.32", features = ["full"] }
hyper-tls = "=0.5.0"
axum = { version = "=0.6.20", features = ["ws", "headers", "macros", "multipart", "matched-path", "original-uri", "query", "tokio", "tower-log", "http1", "http2", "json"] }
bytes = "=1.11.1"
chrono = { version = "=0.4.38", features = ["serde"] }
rayon = "=1.10.0"
rayon-core = "=1.12.1"
crossbeam-deque = "=0.8.5"
crossbeam-epoch = "=0.9.18"
keccak-asm = "=0.1.4"
primitive-types = { version = "=0.12.2", features = ["serde", "rlp"] }
ruint = { version = "=1.12.3", features = ["serde", "rlp"] }
clap = "=2.34.0"
log4rs = { version = "=1.3.0", features = ["all_components"] }
sysinfo = "=0.29.11"
openssl = "=0.10.73"
native-tls = "=0.2.14"
tokio-native-tls = "=0.3.1"
futures-util = { version = "=0.3.31", features = ["io", "sink", "channel"] }
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "=1.0.120"
rmp-serde = "=1.3.0"
ethers-core = "=2.0.14"
ethabi = "=18.0.0"
jsonrpsee-core = { version = "=0.24.7", features = ["client", "server"] }
url = "=2.5.4"
idna = "=1.0.3"
k256 = "=0.13.3"
curve25519-dalek-ng = "=4.1.1"
rust_decimal = "=1.36.0"
lz4_flex = "=0.11.6"
blake3 = "=1.7.0"
sha2 = "=0.9.9"
ripemd = "=0.1.3"
tiny-keccak = { version = "=2.0.2", features = ["keccak", "sha3"] }
parking_lot = "=0.12.3"
socket2 = { version = "=0.5.7", features = ["all"] }
mio = { version = "=1.0.2", features = ["os-poll", "net"] }
signal-hook-registry = "=1.4.2"
lru = "=0.16.3"
bitvec = "=1.0.1"
threadpool = "=1.8.1"
shlex = "=1.3.0"
textwrap = "=0.11.0"
anyhow = "=1.0.86"
arc-swap = "=1.7.1"
base64 = "=0.20.0"
bs58 = "=0.5.1"
const-hex = "=1.14.0"
httparse = "=1.9.4"
httpdate = "=1.0.3"
mime = "=0.3.17"
smallvec = "=1.13.2"
slab = "=0.4.9"

[profile.release]
opt-level = 3
overflow-checks = true
lto = "thin"
