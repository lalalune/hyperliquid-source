[package]
name = "vovf_h1416"
version = "0.0.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
hyper = { version = "=0.14.16", features = ["full"] }
hyper-tls = "=0.5.0"
tokio = { version = "=1.45.1", features = ["full"] }
tokio-util = { version = "=0.7.15", features = ["full"] }
chrono = { version = "=0.4.41", features = ["serde"] }

[profile.release]
debug = false
