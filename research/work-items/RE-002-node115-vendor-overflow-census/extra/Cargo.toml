[package]
name = "vovf_extra"
version = "0.0.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
tokio = { version = "=1.44.2", features = ["full"] }
tokio-util = { version = "=0.7.11", features = ["full"] }
axum = { version = "=0.6.20", features = ["ws", "headers", "macros", "multipart", "matched-path", "original-uri", "query", "tokio", "tower-log", "http1", "http2", "json"] }
axum_08 = { package = "axum", version = "=0.8.4", features = ["ws", "macros"] }
hyper = { version = "=0.14.32", features = ["full"] }
hyper_160 = { package = "hyper", version = "=1.6.0", features = ["full"] }
h2 = "=0.3.26"
h2_04 = { package = "h2", version = "=0.4.11" }
bincode = "=2.0.1"
secp256k1_29 = { package = "secp256k1", version = "=0.29.0", features = ["rand-std", "recovery", "global-context", "serde"] }
secp256k1_30 = { package = "secp256k1", version = "=0.30.0", features = ["rand", "recovery", "global-context", "serde"] }
socket2_04 = { package = "socket2", version = "=0.4.10", features = ["all"] }
socket2_05 = { package = "socket2", version = "=0.5.7", features = ["all"] }
hashbrown_15 = { package = "hashbrown", version = "=0.15.2" }
openssl = "=0.10.73"
native-tls = "=0.2.14"
tokio-native-tls = "=0.3.1"
aurora-engine-modexp = "=1.2.0"
log4rs = { version = "=1.3.0", features = ["all_components"] }
chrono = { version = "=0.4.38", features = ["serde"] }
serde_json = "=1.0.140"
clap4 = { package = "clap", version = "=4.5.42", features = ["derive", "env"] }
jsonrpsee-core = { version = "=0.24.7", features = ["client", "server"] }

[profile.release]
debug = false
