[package]
name = "w6_h2_hyper_tokio_exact"
version = "0.0.0"
edition = "2021"

[dependencies]
tikv-jemallocator = "=0.6.0"
tokio = { version = "=1.53.1", features = ["full"] }
tokio-util = { version = "=0.7.11", features = ["full"] }
tokio-native-tls = "=0.3.1"
native-tls = "=0.2.14"
h2 = "=0.3.26"
hyper = { version = "=0.14.29", features = ["full"] }
hyper-tls = "=0.5.0"
http = "=0.2.12"
bytes = "=1.11.1"
slab = "=0.4.9"
httparse = "=1.9.4"
indexmap = "=2.7.1"
hashbrown = "=0.15.2"
tracing = { version = "=0.1.41", default-features = false, features = ["std"] }
tracing-core = "=0.1.34"
parking_lot = "=0.12.3"
parking_lot_core = "=0.9.10"
futures-util = "=0.3.31"
futures-core = "=0.3.31"
futures-sink = "=0.3.31"
futures-channel = "=0.3.31"
want = "=0.3.1"
socket2 = "=0.6.5"
mio = "=1.2.4"
axum = "=0.6.20"
matchit = "=0.7.3"
crossbeam-deque = "=0.8.5"
rayon = "=1.10.0"
rayon-core = "=1.12.1"
smallvec = "=1.13.2"
serde_json = "=1.0.140"

[profile.release]
opt-level = 3
overflow-checks = true
lto = "thin"
