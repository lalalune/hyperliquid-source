[package]
name = "w6_tokio_1531_deep"
version = "0.0.0"
edition = "2021"

[dependencies]
tikv-jemallocator = "=0.6.0"
tokio = { version = "=1.53.1", features = ["full"] }
tokio-util = { version = "=0.7.15", features = ["full"] }
tokio-native-tls = "=0.3.1"
native-tls = "=0.2.14"
h2 = "=0.3.26"
hyper = { version = "=0.14.29", features = ["full"] }
hyper-tls = "=0.5.0"
http = "=0.2.12"
bytes = "=1.11.1"
futures-util = "=0.3.31"
want = "=0.3.1"
axum = "=0.6.20"
matchit = "=0.7.3"
chrono = { version = "=0.4.38", default-features = false, features = ["clock", "std", "serde"] }
rayon = "=1.10.0"
rayon-core = "=1.12.1"
crossbeam-deque = "=0.8.5"
smallvec = "=1.13.2"
ruint = "=1.12.3"
keccak-asm = "=0.1.6"
blake3 = "=1.7.0"
primitive-types = "=0.12.2"
idna = "=1.0.3"
icu_normalizer = "=1.5.0"
url = "=2.5.4"
serde_json = "=1.0.140"

[profile.release]
opt-level = 3
overflow-checks = true
lto = "thin"
