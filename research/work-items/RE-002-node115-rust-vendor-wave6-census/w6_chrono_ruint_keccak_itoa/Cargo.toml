[package]
name = "w6_chrono_ruint_keccak_itoa"
version = "0.0.0"
edition = "2021"

[dependencies]
tikv-jemallocator = "=0.6.0"
chrono = { version = "=0.4.38", features = ["serde", "clock"] }
log4rs = { version = "=1.3.0", features = ["all_components"] }
log = "=0.4.27"
ruint = { version = "=1.12.3", features = ["serde", "rlp"] }
keccak-asm = "=0.1.6"
itoa = { version = "=0.4.8", features = ["i128"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.140"
alloy-rlp = "=0.3.17"

[profile.release]
opt-level = 3
overflow-checks = true
lto = "thin"
