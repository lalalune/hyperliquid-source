[package]
name = "w6_log4rs_chrono_hyper16"
version = "0.0.0"
edition = "2021"

[dependencies]
tikv-jemallocator = "=0.6.0"
log4rs = { version = "=1.3.0", default-features = false, features = ["console_appender", "file_appender", "rolling_file_appender", "compound_policy", "delete_roller", "fixed_window_roller", "size_trigger", "pattern_encoder", "threshold_filter"] }
log = "=0.4.27"
chrono = { version = "=0.4.38", default-features = false, features = ["clock", "std", "serde"] }
hyper = { version = "=0.14.16", features = ["full"] }
hyper-tls = "=0.5.0"
h2 = "=0.3.26"
http = "=0.2.12"
tokio = { version = "=1.45.1", features = ["full"] }
native-tls = "=0.2.14"
tokio-native-tls = "=0.3.1"
bytes = "=1.11.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.140"

[profile.release]
opt-level = 3
overflow-checks = true
lto = "thin"
