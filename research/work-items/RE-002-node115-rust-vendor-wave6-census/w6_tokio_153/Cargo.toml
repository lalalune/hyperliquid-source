[package]
name = "w6_tokio_153"
version = "0.0.0"
edition = "2021"

[dependencies]
tikv-jemallocator = "=0.6.0"
tokio = { version = "=1.53.3", features = ["full"] }
tokio-util = { version = "=0.7.15", features = ["full"] }
h2 = "=0.3.26"
http = "=0.2.12"
hyper = { version = "=0.14.29", features = ["full"] }
hyper-tls = "=0.5.0"
native-tls = "=0.2.14"
tokio-native-tls = "=0.3.1"
bytes = "=1.11.1"
futures-util = "=0.3.31"

[profile.release]
opt-level = 3
overflow-checks = true
lto = "thin"
