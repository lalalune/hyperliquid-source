[package]
name = "zforks_w3_sys_codec"
version = "0.0.0"
edition = "2021"

[dependencies]
tikv-jemallocator = "=0.6.0"
chrono = { version = "=0.4.38", features = ["serde"] }
ruint = { version = "=1.12.3", features = ["serde", "rlp"] }
clap = "=2.34.0"
clap4 = { package = "clap", version = "=4.5.42", features = ["derive", "env"] }
rayon = "=1.10.0"
rayon-core = "=1.12.1"
crossbeam-deque = "=0.8.5"
crossbeam-epoch = "=0.9.18"
log4rs = { version = "=1.3.0", features = ["all_components"] }
sysinfo = "=0.29.11"
bitvec = "=1.0.1"
lru = "=0.16.3"
indexmap = "=2.5.0"
hashbrown = "=0.15.2"
arc-swap = "=1.7.1"
once_cell = "=1.20.2"
lz4_flex = "=0.11.6"
blake3 = "=1.7.0"
sha2 = "=0.9.9"
tiny-keccak = { version = "=2.0.2", features = ["keccak", "sha3"] }
base64 = "=0.20.0"
const-hex = "=1.14.0"
bs58 = "=0.5.1"
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "=1.0.120"
rmp-serde = "=1.3.0"
bincode = "=1.3.3"
primitive-types = { version = "=0.12.2", features = ["serde", "rlp"] }
ethabi = "=18.0.0"
anyhow = "=1.0.86"
rand = "=0.8.5"
aurora-engine-modexp = "=1.2.0"

[profile.release]
opt-level = 3
overflow-checks = true
lto = "thin"
