[package]
name = "zforks_w3_net_async"
version = "0.0.0"
edition = "2021"

[dependencies]
tikv-jemallocator = "=0.6.0"
tokio = { version = "=1.44.2", features = ["full"] }
tokio-util = { version = "=0.7.11", features = ["full"] }
h2 = "=0.3.26"
h2_04 = { package = "h2", version = "=0.4.11" }
http = "=0.2.12"
http_1 = { package = "http", version = "=1.5.0" }
hyper = { version = "=0.14.32", features = ["full"] }
hyper_160 = { package = "hyper", version = "=1.6.0", features = ["full"] }
hyper-tls = "=0.5.0"
axum = { version = "=0.6.20", features = ["ws", "headers", "macros", "multipart", "matched-path", "original-uri", "query", "tokio", "tower-log", "http1", "http2", "json"] }
axum_08 = { package = "axum", version = "=0.8.4", features = ["ws", "macros"] }
tokio-tungstenite = "=0.20.1"
futures-util = { version = "=0.3.31", features = ["io", "sink", "channel"] }
futures-channel = "=0.3.31"
openssl = "=0.10.73"
native-tls = "=0.2.14"
tokio-native-tls = "=0.3.1"
bytes = "=1.11.1"
httparse = "=1.9.4"
httpdate = "=1.0.3"
url = "=2.5.4"
mime = "=0.3.17"
matchit = "=0.7.3"
parking_lot = "=0.12.3"
mio = { version = "=1.0.2", features = ["os-poll", "net"] }
socket2 = { version = "=0.5.7", features = ["all"] }
serde_json = "=1.0.120"

[profile.release]
opt-level = 3
overflow-checks = true
lto = "thin"
