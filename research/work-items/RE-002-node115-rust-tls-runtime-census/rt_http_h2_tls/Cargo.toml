[package]
name = "rt_http_h2_tls"
version = "0.0.0"
edition = "2021"

[dependencies]
tikv-jemallocator = "=0.6.0"
tokio = { version = "=1.45.1", features = ["full"] }
tokio-util = { version = "=0.7.15", features = ["full"] }
h2 = "=0.3.26"
h2_04 = { package = "h2", version = "=0.4.11" }
http = "=0.2.12"
http_1 = { package = "http", version = "=1.5.0" }
hyper = { version = "=0.14.32", features = ["full"] }
hyper_1 = { package = "hyper", version = "=1.6.0", features = ["full"] }
hyper-util = { version = "=0.1.17", features = ["full"] }
axum = { version = "=0.6.20", features = ["ws", "headers", "macros", "multipart", "matched-path", "original-uri", "query", "tokio", "tower-log", "http1", "http2", "json"] }
axum_08 = { package = "axum", version = "=0.8.4", features = ["ws", "macros"] }
tungstenite = "=0.20.1"
tungstenite_26 = { package = "tungstenite", version = "=0.26.2" }
tokio-tungstenite = "=0.20.1"
tracing = "=0.1.44"
tracing-core = "=0.1.36"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt", "registry", "ansi", "std"] }
clap = { version = "=4.5.42", features = ["derive", "env", "wrap_help"] }
chrono = { version = "=0.4.41", features = ["serde"] }
flate2 = "=1.1.0"
regex = "=1.11.1"
url = "=2.5.4"
idna = "=1.0.3"
rand = "=0.8.5"
parking_lot = "=0.12.3"
rayon = "=1.10.0"
crossbeam-epoch = "=0.9.18"
crossbeam-deque = "=0.8.5"
futures-util = { version = "=0.3.31", features = ["io", "sink", "channel"] }
bytes = "=1.11.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.140"
http-body-util = "=0.1.5"
tower = { version = "=0.4.13", features = ["full"] }
httpdate = "=1.0.3"
httparse = "=1.9.4"
mime = "=0.3.17"
once_cell = "=1.20.2"
arc-swap = "=1.7.1"

[profile.release]
opt-level = 3
overflow-checks = true
lto = "thin"
