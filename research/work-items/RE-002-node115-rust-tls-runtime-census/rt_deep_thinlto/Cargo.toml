[package]
name = "rt_deep_thinlto"
version = "0.0.0"
edition = "2021"

[dependencies]
tikv-jemallocator = "=0.6.0"
tokio = { version = "=1.44.2", features = ["full"] }
sysinfo = "=0.29.11"
log4rs = { version = "=1.3.0", features = ["all_components"] }
log = "=0.4.27"
clap = "=2.34.0"
chrono = { version = "=0.4.38", features = ["serde", "clock"] }
openssl = "=0.10.73"
rayon = "=1.10.0"
rayon-core = "=1.12.1"
parking_lot = "=0.12.3"
parking_lot_core = "=0.9.10"
crossbeam-epoch = "=0.9.18"
crossbeam-deque = "=0.8.5"
arc-swap = "=1.7.1"
rand = "=0.8.5"
rand_chacha = "=0.3.1"
rand_core = "=0.6.4"
url = "=2.5.4"
idna = "=1.0.3"
tracing = "=0.1.44"
tracing-core = "=0.1.36"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt", "json"] }
bitvec = "=1.0.1"
flate2 = "=1.1.0"
miniz_oxide = "=0.8.9"
once_cell = "=1.20.2"
serde_yaml = "=0.9.34+deprecated"
serde_json = "=1.0.154"

[profile.release]
opt-level = 3
overflow-checks = true
lto = "thin"
