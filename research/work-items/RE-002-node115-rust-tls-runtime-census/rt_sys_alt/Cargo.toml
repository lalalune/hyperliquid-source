[package]
name = "rt_sys_alt"
version = "0.0.0"
edition = "2021"

[dependencies]
tikv-jemallocator = "=0.6.0"
sysinfo = "=0.29.11"
arc-swap = "=1.7.1"
bitvec = "=1.0.1"
mime = "=0.3.17"
textwrap = "=0.11.0"
once_cell = "=1.20.2"
icu_normalizer = "=1.5.0"
icu_collections = "=1.5.0"
httpdate = "=1.0.3"
httparse = "=1.9.4"
anyhow = "=1.0.86"
tokio = { version = "=1.45.1", features = ["full"] }
rayon = "=1.12.0"
rayon-core = "=1.13.0"
parking_lot = "=0.12.5"
chrono = { version = "=0.4.41", features = ["serde", "clock"] }
url = "=2.5.8"
regex = "=1.13.1"
tracing-subscriber = { version = "=0.2.25", features = ["env-filter", "fmt", "json"] }
lz4_flex = "=0.14.0"
tungstenite = "=0.26.2"
clap = { version = "=4.5.42", features = ["std", "help", "usage", "error-context"] }

[profile.release]
opt-level = 3
overflow-checks = true
lto = "thin"
