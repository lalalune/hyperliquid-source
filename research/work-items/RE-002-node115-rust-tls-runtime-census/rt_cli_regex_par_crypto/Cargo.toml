[package]
name = "rt_cli_regex_par_crypto"
version = "0.0.0"
edition = "2021"

[dependencies]
tikv-jemallocator = "=0.6.0"
clap = "=2.34.0"
regex = "=1.11.1"
regex-automata = "=0.4.18"
regex-syntax = "=0.8.11"
chrono = { version = "=0.4.38", features = ["serde", "clock"] }
iana-time-zone = "=0.1.60"
url = "=2.5.4"
idna = "=1.0.3"
idna_adapter = "=1.2.0"
form_urlencoded = "=1.2.1"
percent-encoding = "=2.3.1"
flate2 = "=1.1.0"
miniz_oxide = "=0.8.9"
rayon = "=1.10.0"
rayon-core = "=1.12.1"
crossbeam-epoch = "=0.9.18"
crossbeam-deque = "=0.8.5"
parking_lot = "=0.12.3"
parking_lot_core = "=0.9.10"
rand = "=0.8.5"
rand_chacha = "=0.3.1"
rand_core = "=0.6.4"
base64 = "=0.20.0"
sha2_09 = { package = "sha2", version = "=0.9.9" }
sha2 = "=0.10.9"
blake3 = "=1.7.0"
curve25519-dalek-ng = "=4.1.1"
p256 = "=0.13.2"
bs58 = "=0.5.1"
const-hex = "=1.14.0"
rustc-hex = "=2.1.0"
lz4_flex = "=0.11.6"

[profile.release]
opt-level = 3
overflow-checks = true
lto = "thin"
