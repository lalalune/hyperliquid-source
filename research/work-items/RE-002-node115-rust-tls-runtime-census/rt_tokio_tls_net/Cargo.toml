[package]
name = "rt_tokio_tls_net"
version = "0.0.0"
edition = "2021"

[dependencies]
tikv-jemallocator = "=0.6.0"
tokio = { version = "=1.44.2", features = ["full"] }
tokio-util = { version = "=0.7.15", features = ["full"] }
tokio-native-tls = "=0.3.1"
native-tls = "=0.2.14"
openssl = "=0.10.73"
mio = { version = "=1.0.2", features = ["os-poll", "net", "os-ext"] }
socket2 = { version = "=0.5.7", features = ["all"] }
socket2_04 = { package = "socket2", version = "=0.4.10", features = ["all"] }
futures-util = "=0.3.31"
futures-channel = "=0.3.31"
futures-core = "=0.3.31"
tracing = "=0.1.44"
tracing-core = "=0.1.36"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt", "json"] }
log4rs = { version = "=1.3.0", features = ["all_components"] }
log = "=0.4.27"
bytes = "=1.11.1"
tungstenite = "=0.20.1"
tokio-tungstenite = "=0.20.1"

[profile.release]
opt-level = 3
overflow-checks = true
lto = "thin"
