[package]
name = "hl_node115_serialize_census"
version = "0.0.0"
edition = "2021"

[dependencies]
tikv-jemallocator = "=0.6.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.140", features = ["raw_value", "unbounded_depth"] }
rmp-serde = "=1.3.0"

[profile.release]
opt-level = 3
overflow-checks = true
lto = "thin"
