[package]
name = "thinlto_w3_revm41"
version = "0.0.0"
edition = "2021"

[dependencies]
tikv-jemallocator = "=0.6.0"
revm = { version = "=41.0.0", features = ["std", "blst", "bn", "secp256k1", "asm-keccak", "serde"] }
revm-bytecode = "=41.0.0"
revm-context = "=41.0.0"
revm-context-interface = "=41.0.0"
revm-database = "=41.0.0"
revm-handler = "=41.0.0"
revm-inspector = "=41.0.0"
revm-interpreter = "=41.0.0"
revm-precompile = "=41.0.0"
revm-primitives = "=41.0.0"
revm-state = "=41.0.0"
alloy-primitives = { version = "=1.6.1", features = ["serde", "rlp", "k256"] }
alloy-rlp = "=0.3.17"
alloy-consensus = { version = "=2.1.1", features = ["serde", "k256", "kzg"] }
alloy-eips = { version = "=2.1.1", features = ["serde", "kzg"] }
alloy-eip2930 = { version = "=0.2.3", features = ["serde"] }
alloy-eip7702 = { version = "=0.6.3", features = ["serde", "k256"] }
alloy-eip7928 = "=0.4.5"
alloy-evm = "=0.37.1"
alloy-rpc-types-eth = "=2.1.1"
alloy-sol-types = "=1.6.1"
alloy-trie = "=0.9.5"
nybbles = "=0.4.8"
keccak-asm = "=0.1.6"
ruint = { version = "=1.18.0", features = ["serde", "rlp"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
rmp-serde = "=1.3.0"
tokio = { version = "=1.52.3", features = ["full"] }
tokio-util = { version = "=0.7.18", features = ["full"] }
hyper = { version = "=1.10.1", features = ["full"] }
h2 = "=0.4.14"
http = "=1.4.2"
bytes = "=1.12.1"
rayon = "=1.12.0"
rayon-core = "=1.13.0"
crossbeam-deque = "=0.8.6"
crossbeam-epoch = "=0.9.20"
jsonrpsee-core = { version = "=0.26.0", features = ["client", "server"] }
jsonrpsee-types = "=0.26.0"
k256 = { version = "=0.13.4", features = ["ecdsa", "ecdh", "sha256", "serde"] }
p256 = { version = "=0.13.2", features = ["ecdsa", "ecdh", "serde"] }
blst = "=0.3.16"
chrono = { version = "=0.4.41", features = ["serde"] }
url = "=2.5.8"
idna = "=1.1.0"
icu_collections = "=2.0.0"
icu_normalizer = "=2.0.1"
lz4_flex = "=0.12.1"
bitvec = "=1.0.1"
sha2 = "=0.10.9"
blake3 = "=1.8.5"
httparse = "=1.10.1"
httpdate = "=1.0.3"
futures-util = { version = "=0.3.31", features = ["io", "sink", "channel"] }

[profile.release]
opt-level = 3
overflow-checks = true
lto = "thin"
