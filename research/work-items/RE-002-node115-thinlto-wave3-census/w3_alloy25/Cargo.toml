[package]
name = "thinlto_w3_alloy25"
version = "0.0.0"
edition = "2021"

[dependencies]
tikv-jemallocator = "=0.6.0"
revm = { version = "=43.0.3", features = ["std", "blst", "bn", "secp256k1", "asm-keccak", "serde"] }
revm-bytecode = "=43.0.0"
revm-context = "=43.0.3"
revm-context-interface = "=43.0.2"
revm-database = "=43.0.1"
revm-handler = "=43.0.3"
revm-inspector = "=43.0.3"
revm-interpreter = "=43.0.2"
revm-precompile = "=43.0.3"
revm-state = "=43.0.1"
alloy-primitives = { version = "=1.7.3", features = ["serde", "rlp", "k256"] }
alloy-rlp = "=0.3.17"
alloy-consensus = { version = "=2.5.0", features = ["serde", "k256"] }
alloy-eips = { version = "=2.5.0", features = ["serde"] }
alloy-eip2930 = { version = "=0.2.4", features = ["serde"] }
alloy-eip7702 = { version = "=0.6.3", features = ["serde", "k256"] }
alloy-evm = "=0.39.0"
alloy-rpc-types-eth = "=2.5.0"
alloy-sol-types = "=1.7.3"
alloy-trie = "=0.9.9"
nybbles = "=0.4.9"
keccak-asm = "=0.1.9"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
rmp-serde = "=1.3.1"
jsonrpsee-core = { version = "=0.26.1", features = ["client", "server"] }
jsonrpsee-types = "=0.26.1"
lz4_flex = "=0.14.0"
bitvec = "=1.1.1"
sha2_11 = { package = "sha2", version = "=0.11.1" }
ripemd_02 = { package = "ripemd", version = "=0.2.0" }
const-hex = "=1.14.1"
base64_22 = { package = "base64", version = "=0.22.1" }
openssl = "=0.10.82"
tokio = { version = "=1.54.1", features = ["full"] }
axum = { version = "=0.8.9", features = ["ws", "macros"] }
axum-extra = { version = "=0.12.6", features = ["typed-header"] }
anyhow = "=1.0.97"
serde_yaml = "=0.9.34"
serde_path_to_error = "=0.1.20"
curve25519-dalek-ng = "=4.1.1"
ethabi = "=18.0.0"
ethers-core = "=2.0.14"
rust_decimal = { version = "=1.36.0", features = ["serde", "maths"] }
impl-serde = "=0.4.0"
primitive-types = { version = "=0.12.2", features = ["serde", "rlp"] }
secp256k1_29 = { package = "secp256k1", version = "=0.29.0", features = ["rand-std", "recovery", "global-context", "serde"] }
secp256k1_30 = { package = "secp256k1", version = "=0.30.0", features = ["rand", "recovery", "global-context", "serde"] }
log4rs = { version = "=1.3.0", features = ["all_components"] }
sysinfo = "=0.29.11"
clap = "=2.34.0"
bs58 = "=0.5.1"
tiny-keccak = { version = "=2.0.2", features = ["keccak", "sha3"] }
aurora-engine-modexp = "=1.2.0"

[profile.release]
opt-level = 3
overflow-checks = true
lto = "thin"
