[package]
name = "thinlto_w3cs"
version = "0.0.0"
edition = "2021"

[dependencies]
tikv-jemallocator = "=0.6.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value", "unbounded_depth"] }
rmp-serde = "=1.3.0"
hashbrown = "=0.15.2"
hashbrown_16 = { package = "hashbrown", version = "=0.16.1" }
indexmap = { version = "=2.5.0", features = ["serde"] }
primitive-types = { version = "=0.12.2", features = ["serde", "rlp"] }
ruint = { version = "=1.21.1", features = ["serde", "rlp"] }
alloy-primitives = { version = "=1.5.2", features = ["serde", "rlp", "k256"] }
smallvec = { version = "=1.13.2", features = ["serde"] }
lru = "=0.16.3"
bincode = "=2.0.1"
bincode1 = { package = "bincode", version = "=1.3.3" }
rust_decimal = { version = "=1.36.0", features = ["serde"] }
chrono = { version = "=0.4.38", features = ["serde"] }
ordered-float = { version = "=2.10.1", features = ["serde"] }
ark-bls12-381 = "=0.5.0"
ark-bn254 = "=0.5.0"
ark-ec = "=0.5.0"
ark-ff = "=0.5.0"
ark-serialize = "=0.5.0"

[profile.release]
opt-level = 3
overflow-checks = true
lto = "thin"
