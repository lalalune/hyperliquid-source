[package]
name = "zforks_w4_math_serde_rpc"
version = "0.0.0"
edition = "2021"

[dependencies]
tikv-jemallocator = "=0.6.0"
ruint = { version = "=1.18.0", features = ["serde", "rlp"] }
rust_decimal = { version = "=1.36.0", features = ["maths", "serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
rmp-serde = "=1.3.1"
rmp = "=0.8.15"
bincode = { version = "=2.0.1", features = ["derive", "std"] }
jsonrpsee-core = { version = "=0.26.0", features = ["client", "server"] }
jsonrpsee-types = "=0.26.0"
ethabi = "=18.0.0"
ethers-core = "=2.0.14"
alloy-evm = { version = "=0.39.0", features = ["std", "rpc", "engine", "call-util", "overrides"] }
alloy-consensus = { version = "=2.5.0", features = ["serde", "k256"] }
alloy-eips = { version = "=2.5.0", features = ["serde"] }
alloy-rpc-types-eth = "=2.5.0"
alloy-rpc-types-engine = "=2.5.0"
alloy-trie = "=0.9.9"
alloy-primitives = { version = "=1.7.3", features = ["serde", "rlp", "k256"] }
alloy-rlp = "=0.3.17"

[profile.release]
opt-level = 3
overflow-checks = true
lto = "thin"
