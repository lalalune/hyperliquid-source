[package]
name = "w5_alloc_collections"
version = "0.0.0"
edition = "2021"

[dependencies]
tikv-jemallocator = "=0.6.0"
hashbrown = { version = "=0.15.2", features = ["serde", "raw-entry"] }
hashbrown_16 = { package = "hashbrown", version = "=0.16.1", features = ["serde", "raw-entry"] }
indexmap = { version = "=2.7.1", features = ["serde"] }
foldhash = "=0.1.5"
ahash = "=0.8.12"
rustc-hash = "=2.1.3"
smallvec = { version = "=1.13.2", features = ["serde"] }
bytes = "=1.11.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.140", features = ["preserve_order"] }
alloy-primitives = { version = "=1.7.3", features = ["serde", "rlp"] }
primitive-types = { version = "=0.12.2", features = ["serde", "rlp"] }
ruint = { version = "=1.21.1", features = ["serde", "rlp"] }
rust_decimal = { version = "=1.36.0", features = ["serde"] }
ordered-float = { version = "=2.10.1", features = ["serde"] }
chrono = { version = "=0.4.38", features = ["serde"] }
itoa = "=1.0.19"
itoa_04 = { package = "itoa", version = "=0.4.8" }

[profile.release]
opt-level = 3
overflow-checks = true
lto = "thin"
