[package]
name = "w5_rlib_exact"
version = "0.0.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
clap = { version = "=2.34.0", default-features = false }
rocksdb = { version = "=0.21.0", features = ["multi-threaded-cf"] }
chrono = { version = "=0.4.38", features = ["serde", "clock"] }
tokio = { version = "=1.54.1", features = ["full"] }
tokio-util = { version = "=0.7.15", features = ["full"] }
h2 = "=0.3.26"
http = "=0.2.12"
hyper = { version = "=0.14.29", features = ["full"] }
hyper-tls = "=0.5.0"
native-tls = "=0.2.14"
tokio-native-tls = "=0.3.1"
axum = { version = "=0.6.20", features = ["ws", "headers", "macros", "multipart", "matched-path", "original-uri", "query", "tokio", "tower-log", "http1", "http2", "json"] }
tower = { version = "=0.4.13", features = ["full"] }
jsonrpsee-core = { version = "=0.26.1", features = ["server", "client"] }
jsonrpsee-types = "=0.26.1"
rayon = "=1.10.0"
rayon-core = "=1.12.1"
indexmap = { version = "=2.7.1", features = ["serde"] }
hashbrown = { version = "=0.15.2", features = ["serde", "raw-entry"] }
hashbrown_16 = { package = "hashbrown", version = "=0.16.1", features = ["serde", "raw-entry"] }
foldhash = "=0.1.5"
smallvec = { version = "=1.13.2", features = ["serde"] }
log4rs = { version = "=1.3.0", features = ["all_components"] }
sysinfo = "=0.29.11"
bytes = "=1.11.1"
futures-util = { version = "=0.3.31", features = ["io", "sink", "channel"] }
want = "=0.3.2"
itoa = "=0.4.8"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"

[profile.release]
opt-level = 3
overflow-checks = true
lto = false
