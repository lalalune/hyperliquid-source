[package]
name = "w5_cli_chrono_rayon_rdb"
version = "0.0.0"
edition = "2021"

[dependencies]
tikv-jemallocator = "=0.6.0"
clap = { version = "=2.34.0", default-features = false }
chrono = { version = "=0.4.38", features = ["serde", "clock"] }
rayon = "=1.10.0"
rayon-core = "=1.12.1"
rocksdb = { version = "=0.21.0", default-features = false, features = ["lz4", "zstd", "snappy", "bzip2", "zlib"] }
log4rs = { version = "=1.3.0", features = ["all_components"] }
log = "=0.4.27"
sysinfo = "=0.29.11"
tokio = { version = "=1.52.3", features = ["full"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.140"
serde_yaml = "=0.9.34"

[profile.release]
opt-level = 3
overflow-checks = true
lto = "thin"
