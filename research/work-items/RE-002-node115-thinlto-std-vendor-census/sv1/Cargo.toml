[package]
name = "thinlto_sv1"
version = "0.0.0"
edition = "2021"

[dependencies]
tikv-jemallocator = "=0.6.0"
anyhow = "=1.0.86"
axum = { version = "=0.6.20", features = ["ws", "headers", "macros", "multipart", "matched-path", "original-uri", "query", "tokio", "tower-log", "http1", "http2", "json"] }
base64 = "=0.20.0"
bincode = "=2.0.1"
blake3 = "=1.7.0"
bs58 = "=0.5.1"
bytes = "=1.11.1"
chrono = { version = "=0.4.38", features = ["serde"] }
clap = "=2.34.0"
const-hex = "=1.14.0"
curve25519-dalek-ng = "=4.1.1"
ethabi = "=18.0.0"
ethers-core = "=2.0.14"
futures-util = "=0.3.31"
h2 = "=0.3.26"
http = "=0.2.12"
httparse = "=1.9.4"
hyper = { version = "=0.14.32", features = ["full"] }
hyper-tls = "=0.5.0"
idna = "=1.0.3"
jsonrpsee-core = { version = "=0.24.7", features = ["client", "server"] }
k256 = "=0.13.3"
log4rs = { version = "=1.3.0", features = ["all_components"] }
lru = "=0.16.3"
lz4_flex = "=0.11.6"
mio = { version = "=1.0.2", features = ["os-poll", "net"] }
native-tls = "=0.2.14"
openssl = "=0.10.73"
parking_lot = "=0.12.3"
rayon = "=1.10.0"
ripemd = "=0.1.3"
rmp-serde = "=1.3.0"
rust_decimal = "=1.36.0"
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "=1.0.120"
sha2 = "=0.9.9"
socket2 = { version = "=0.5.7", features = ["all"] }
sysinfo = "=0.29.11"
tiny-keccak = { version = "=2.0.2", features = ["keccak"] }
tokio = { version = "=1.44.2", features = ["full"] }
tokio-native-tls = "=0.3.1"
tokio-util = { version = "=0.7.11", features = ["full"] }
tracing-core = "=0.1.36"
url = "=2.5.4"

[profile.release]
opt-level = 3
overflow-checks = true
lto = "thin"
