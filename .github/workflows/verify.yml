name: Verify research inputs
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  static-research:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y ripgrep gnupg git-lfs
      - run: git -C references/can1357-hl lfs pull
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: make rea-install rea-smoke
      - run: make verify test catalogue-check index reproduce

  release-drift:
    # RE-014 fingerprints objdump text, so verify.py pins GNU objdump 2.44 (Debian trixie).
    # Unit tests + mutation controls are portable (pure-Python); drift-verify needs GNU.
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends binutils ca-certificates git git-lfs make python3
      - uses: actions/checkout@v4
        with:
          lfs: true
      - run: python3 -m unittest tests.test_release_drift
      - run: make drift-verify
