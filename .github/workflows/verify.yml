name: Authorized node115 native check
on:
  push:
    branches: [codex/node115-native-check-20261112]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-snippet:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f71a140823e8fe6bbcef4f386279c1d482c432c4
          lfs: true
      - name: Build isolated validation image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/node115-native/guard"
          cat > "$RUNNER_TEMP/node115-native/Dockerfile" <<'DOCKERFILE'
          FROM ubuntu:24.04
          RUN apt-get update && apt-get install -y --no-install-recommends python3 binutils && rm -rf /var/lib/apt/lists/*
          DOCKERFILE
          docker build --pull --tag node115-native-review "$RUNNER_TEMP/node115-native" > "$RUNNER_TEMP/node115-native/image-build.log" 2>&1
          docker image inspect node115-native-review > "$RUNNER_TEMP/node115-native/image.json"
          cat > "$RUNNER_TEMP/node115-native/guard/sitecustomize.py" <<'GUARD'
          """Session-only guard: explicitly authorized offline differential validation; full captured processes and networking remain forbidden."""
          import json
          import os
          from pathlib import Path
          import sys
          ROOT=Path(os.environ.get('PR_REVIEW_REPO', '/Users/shawwalters/hlsource/hyperliquid-source/work/pr-review-20261112/integration')).resolve()
          TEMPORARY_ROOTS=set()
          def reject(message):
              raise PermissionError('PR_REVIEW_DEFERRED: '+message)
          def hook(event,args):
              if event=='tempfile.mkdtemp':
                  temporary=Path(os.fsdecode(args[0])).resolve()
                  if temporary.parent in (ROOT, ROOT/'work'):
                      TEMPORARY_ROOTS.add(temporary)
              if event=='open' and os.environ.get('PR_REVIEW_READONLY_REPO')=='1':
                  path,mode,flags=args
                  writing=(isinstance(mode,str) and any(c in mode for c in 'wax+')) or (isinstance(flags,int) and bool(flags & (os.O_WRONLY|os.O_RDWR|os.O_CREAT|os.O_TRUNC)))
                  if writing and isinstance(path,(str,bytes,os.PathLike)):
                      resolved=Path(os.fsdecode(path)).resolve()
                      try:relative=resolved.relative_to(ROOT)
                      except (ValueError,OSError):relative=None
                      temporary=any(t==resolved or t in resolved.parents for t in TEMPORARY_ROOTS)
                      if relative is not None and relative.parts and relative.parts[0]!='work' and not temporary:
                          reject('verifier attempted to rewrite repository evidence '+str(relative))
              if event=='socket.connect':
                  reject('network connection during offline validation')
              if event=='subprocess.Popen':
                  exe,argv,cwd,env=args
                  argv=argv if isinstance(argv,(list,tuple)) else [argv]
                  cmd=[os.fsdecode(x) for x in argv if isinstance(x,(str,bytes,os.PathLike))]
                  base=Path(os.fsdecode(exe)).name
                  if base in {'gdb','lldb','qemu-system-x86_64','curl','wget','ssh','scp','nc','netcat','socat'}:reject('native target execution/debugger')
                  if base=='git' and any(x in cmd for x in ['push','send-email','clone','fetch','pull']):reject('remote repository write from a test')
                  if base=='gh':reject('GitHub action from a test')
                  if cmd:
                      target=Path(cmd[0])
                      try:blocked=target.is_file() and target.stat().st_size in (105896032,8305392)
                      except OSError:blocked=False
                      if blocked:reject('captured executable launch')
          sys.addaudithook(hook)
          GUARD
      - name: Run authorized offline native snippets
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges --pids-limit=128 --memory=2g --cpus=2 --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,nosuid,nodev --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/repo,ro" --mount "type=bind,src=$RUNNER_TEMP/node115-native/guard,dst=/guard,ro" --workdir /repo --env PYTHONPATH=/guard --env PYTHONDONTWRITEBYTECODE=1 --env PR_REVIEW_REPO=/repo --env PR_REVIEW_READONLY_REPO=1 --env HOME=/tmp --env HYPERLIQUID_ALLOW_CAPTURED_NODE_EXECUTION=I_AUTHORIZE_CAPTURED_NODE_EXECUTION node115-native-review /bin/bash -euc 'uname -m; python3 --version; objdump --version; python3 -m unittest discover -s tests -p test_grow_family_panic_static.py -v' > "$RUNNER_TEMP/node115-native/native-snippet.log" 2>&1
          cat "$RUNNER_TEMP/node115-native/native-snippet.log"
          grep -E 'test_behavioral_differential .* \.\.\. ok$' "$RUNNER_TEMP/node115-native/native-snippet.log"
          grep -E 'test_generate_round_trip .* \.\.\. ok$' "$RUNNER_TEMP/node115-native/native-snippet.log"
          ! grep -q 'skipped=' "$RUNNER_TEMP/node115-native/native-snippet.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node115-native-validation
          path: ${{ runner.temp }}/node115-native
