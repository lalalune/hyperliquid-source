name: Verify research inputs
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  static-research:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y ripgrep gnupg git-lfs llvm
      - run: python3 -m pip install --user --break-system-packages capstone==5.0.7 pytest==8.4.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: make rea-install rea-smoke
      - run: make verify test catalogue-check index reproduce

